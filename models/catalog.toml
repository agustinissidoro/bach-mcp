# Models Bach knows by name. Download one with
#     python py/main.py download <name> --use         from the terminal
#     bach download_model <name> use              from Max
# A name here, a Hugging Face repo ("user/repo", ":QUANT" for one GGUF quantization)
# or a full URL all work the same. Add your own entries; sizes were measured on
# Hugging Face on 2026-10-24.

["qwen3.8-27b-4bit"]
repo = "mlx-community/Qwen3.8-27B-4bit"
format = "mlx"
size_gb = 16.1
note = "your Qwen 3.8 27B, the same 4-bit model as in Ollama"

["qwen3.8-27b-8bit"]
repo = "mlx-community/Qwen3.8-27B-8bit"
format = "mlx"
size_gb = 29.5
note = "the same Qwen at 8 bits: closer to the full model, slower, ~35 GB of memory in use"

["qwen3-8b"]
repo = "mlx-community/Qwen3-8B-4bit"
format = "mlx"
size_gb = 4.6
note = "small and fast; weaker at long algorithms"

["qwen3-0.6b"]
repo = "mlx-community/Qwen3-0.6B-4bit"
format = "mlx"
size_gb = 0.4
note = "tiny: to check that everything runs, not to compose"

["qwen3.8-27b-gguf"]
repo = "unsloth/Qwen3.8-27B-GGUF:Q4_K_M"
format = "gguf"
size_gb = 16.5
note = "your Qwen 3.8 27B as GGUF, run by llama.cpp"

["qwen3-8b-gguf"]
repo = "unsloth/Qwen3-8B-GGUF:Q4_K_M"
format = "gguf"
size_gb = 5.0
note = "small and fast, as GGUF"

["qwen3-0.6b-gguf"]
repo = "unsloth/Qwen3-0.6B-GGUF:Q4_K_M"
format = "gguf"
size_gb = 0.4
note = "tiny, as GGUF: to check that everything runs"
