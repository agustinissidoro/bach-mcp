# Bach configuration — read by `python py/main.py run` (and by `serve` / `agent`).
# Edit this file, then start everything with ./run.command once Max is open.

[model]
backend = "ollama"        # "ollama" = a model served by Ollama (this is how MLX models run)
                          # "llama"  = a GGUF file loaded by llama.cpp itself
ollama_model = "qwen3.8:27b-mlx"   # for backend "ollama": the name shown by `ollama list`
path = ""                 # for backend "llama": absolute path to a local .gguf file
hf_repo = ""              #   ...or a Hugging Face repo, e.g. "user/model-GGUF:Q4_K_M"
alias = "bach"            # name shown in the chat and used by the API
context_size = 16384      # tokens of context. Skill + tools use about 2,500; a long score needs room.
gpu_layers = "auto"       # "auto", "all", or a number of layers to put on the GPU

[generation]
max_tokens = 8192         # limit for ONE reply, including thinking. A note costs ~20 tokens, so this is ~300 notes.
temperature = 0.4
top_p = 0.9
top_k = 40
reasoning = "low"         # "off", "on", "auto" (model default), or a level: "low" "medium" "high" "xhigh"
                          # (levels need the ollama backend and a model that has them; llama treats them as "on")
reasoning_budget = 2048   # llama backend only: tokens the model may spend thinking; -1 = unlimited

[chat]
skill_file = ""           # system prompt. Empty = the built-in skill for the tool set (py/bach_mcp/BACH_SKILL.md)
max_tool_rounds = 4       # tool calls the model may chain in one answer before it is stopped
tool_timeout_seconds = 60 # how long the chat waits for one tool call
show_thinking = true      # show the model's reasoning while it is being written
open_browser = true       # open the chat when everything is ready

[mcp]
host = "127.0.0.1"
port = 8000
toolset = "lean"          # "lean" = JSON tools only; "full" = also the raw bach.roll llll commands
verify_writes = true      # check every write against bach.roll and report the result to the model
tool_log = true           # print each tool call in the terminal

[llama]
binary = "llama-server"   # name on PATH or absolute path. Also needed with the ollama backend: it provides the web chat
host = "127.0.0.1"
port = 8080
parallel = 1              # chat slots. Keep 1: more slots split the context between them
extra_args = []           # any other llama-server flags, e.g. ["--cache-type-k", "q8_0"]

[ollama]
url = "http://127.0.0.1:11434"
autostart = true          # open Ollama if it is not already running
keep_alive = "30m"        # how long Ollama keeps the model in memory after the last message

[max]
send_port = 3000          # Python -> Max (must match bachTCP.js)
receive_port = 3001       # Max -> Python
